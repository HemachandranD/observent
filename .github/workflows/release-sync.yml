name: Sync release branch

# Publishes the lean `release` branch that users install from. `main` stays the
# development branch (tests, CI, docs); this mirrors only the plugin runtime
# surface onto `release` so `claude plugin marketplace add …#release` clones a
# minimal tree instead of the whole repo. See scripts/build-release-branch.sh.

on:
  push:
    tags:
      - 'v*'          # publish on every release tag (e.g. v0.3.0)
  workflow_dispatch:   # …or on demand from the Actions tab

permissions:
  contents: write      # required to force-push the release branch

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and push lean release branch
        env:
          RELEASE_PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash scripts/build-release-branch.sh --push
